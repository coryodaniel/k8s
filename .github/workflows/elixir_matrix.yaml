name: Elixir Compatibility Matrix
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  test:
    uses: mruoss/action_elixir_run_tests/.github/workflows/elixir-run-tests.yml@mise-setup
    with:
      checkout: true
      warnings-as-errors: true
      with-kubernetes: true
      include-integration-tests: true
